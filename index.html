<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026马年贺卡 - 新年快乐</title>
    <script src="https://image.uc.cn/s/uae/g/3n/mos-production/fontawesome-free-7.1.0-web/js/all.min.js"></script>
    <script src="https://image.uc.cn/s/uae/g/3n/mos-production/0915/3.4.17.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;700;900&family=ZCOOL+QingKe+HuangYou&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Noto Serif SC', serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(135deg, #1a0000 0%, #3a0f0f 50%, #5a1f1f 100%);
            color: #fff;
        }
        
        /* 背景装饰层 - 不可交互 */
        .bg-decoration {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            overflow: hidden;
        }
        
        /* 烟花粒子 */
        .firework {
            position: absolute;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }
        
        /* 传统图案装饰 */
        .chinese-pattern {
            position: absolute;
            opacity: 0.03;
            background-size: contain;
            background-repeat: no-repeat;
            pointer-events: none;
        }
        
        /* 可交互元素 - 更高的z-index */
        .interactive {
            position: relative;
            z-index: 10;
        }
        
        /* 贺卡容器增强效果 */
        .card-container {
            position: relative;
            z-index: 20;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(208, 47, 33, 0.3);
        }
        
        /* 噪点纹理 */
        .grain-texture {
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
        }
        
        /* 背景点阵图案 */
        .dot-pattern {
            background-image: radial-gradient(#D02F21 1px, transparent 1px);
            background-size: 20px 20px;
            opacity: 0.1;
        }
        
        /* 光晕效果 */
        .glow-effect {
            box-shadow: 
                0 0 20px rgba(208, 47, 33, 0.3),
                0 0 40px rgba(208, 47, 33, 0.2),
                0 0 60px rgba(208, 47, 33, 0.1);
        }
        
        /* 按钮交互效果 */
        .music-btn {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .music-btn:hover {
            transform: scale(1.1);
            background-color: rgba(208, 47, 33, 0.9) !important;
        }
        
        .music-btn:active {
            transform: scale(0.95);
        }
        
        /* 音乐可视化 */
        .visualizer-bar {
            height: 4px;
            border-radius: 2px;
            background-color: #F7D5A5;
            transition: height 0.2s ease;
        }
        
        /* 动画 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 0.8; }
        }
        
        @keyframes slideIn {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        .float-animation {
            animation: float 3s ease-in-out infinite;
        }
        
        .twinkle-animation {
            animation: twinkle 2s ease-in-out infinite;
        }
        
        .slide-in {
            animation: slideIn 0.8s ease-out forwards;
        }
        
        /* 确保所有交互元素在背景之上 */
        .interactive-element {
            position: relative;
            z-index: 100;
        }
        
        /* 响应式调整 */
        @media (max-width: 640px) {
            .card-container {
                margin: 1rem;
            }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">
    
    <!-- 背景装饰层 -->
    <div class="bg-decoration" id="bgDecoration">
        <!-- 通过JavaScript动态生成烟花和图案 -->
    </div>
    
    <!-- 主内容区域 -->
    <div class="interactive w-full max-w-4xl mx-auto">
        
        <!-- 页面标题 -->
        <header class="text-center mb-8 slide-in interactive-element">
            <h1 class="text-4xl md:text-5xl font-bold mb-2" style="font-family: 'Ma Shan Zheng', cursive; color: #F7D5A5;">龙马精神 · 马到成功</h1>
            <p class="text-lg md:text-xl opacity-90" style="color: #D02F21;">2026农历马年 · 新春贺卡</p>
            
            <!-- 音乐控制面板 -->
            <div class="mt-6 flex justify-center items-center gap-4 interactive-element">
                <div class="flex items-center gap-3 bg-black/30 p-3 rounded-full">
                    <button id="musicToggle" class="music-btn w-12 h-12 rounded-full flex items-center justify-center glow-effect" 
                            style="background-color: #D02F21; color: #F7D5A5;">
                        <i class="fas fa-play text-xl"></i>
                    </button>
                    <div class="flex flex-col">
                        <span class="text-sm font-semibold" style="color: #F7D5A5;">新年音乐</span>
                        <span class="text-xs opacity-80">点击播放/暂停</span>
                    </div>
                </div>
                
                <!-- 音量控制 -->
                <div class="flex items-center gap-2 bg-black/30 p-3 rounded-full">
                    <i class="fas fa-volume-up" style="color: #F7D5A5;"></i>
                    <input type="range" id="volumeControl" min="0" max="100" value="70" 
                           class="w-24 accent-red-600 cursor-pointer">
                </div>
            </div>
            
            <!-- 音乐可视化 -->
            <div id="visualizer" class="mt-4 flex justify-center gap-1 h-8 interactive-element" style="max-width: 300px; margin: 0 auto;"></div>
        </header>
        
        <!-- 贺卡容器 -->
        <div class="card-container mx-auto mb-12 interactive-element">
            <main class="relative w-full max-w-[600px] aspect-[3/4] bg-[#F7D5A5] border-4 border-[#D02F21] shadow-2xl flex flex-col grain-texture sharp-corners glow-effect mx-auto">
                <!-- 顶部装饰边框 -->
                <div class="w-full h-4 sm:h-6 bg-[#111111]"></div>
                
                <!-- 内容区 -->
                <div class="flex-1 flex flex-col p-6 sm:p-10 gap-6 sm:gap-8 relative z-20">
                    <header class="text-center border-b-2 border-[#D02F21] pb-4">
                        <h1 class="text-4xl sm:text-5xl lg:text-6xl font-black tracking-tighter uppercase leading-none" style="color: #D02F21;">Year of horse</h1>
                        <div class="mt-2 flex justify-center items-center gap-2">
                            <span class="h-[1px] w-8 bg-[#D02F21]"></span>
                            <span class="text-xs font-mono tracking-widest uppercase" style="color: #D02F21;">2026 Edition</span>
                            <span class="h-[1px] w-8 bg-[#D02F21]"></span>
                        </div>
                    </header>

                    <!-- 中央画框 -->
                    <div class="flex-1 flex items-center justify-center min-h-0">
                        <div class="w-full aspect-square border-4 border-[#D02F21] p-3 sm:p-4 bg-[#FFF1DD] shadow-inner flex flex-col justify-center">
                            <div class="photo-wrapper">
                                <img alt="Spring Festival Year of the 2026 Horse Illustration" 
                                     src="https://agent.qianwen.com/mos/a2a58606bd9c42bb9655f2eaea1cb4f0/4ccb134534e2eb834ac2c36c95342d83"
                                     class="w-full h-full object-contain float-animation">
                            </div>
                        </div>
                    </div>

                    <!-- 底部祝福语 -->
                    <div class="text-center mt-auto">
                        <h2 class="text-3xl sm:text-4xl font-bold uppercase tracking-wide" style="color: #D02F21;">Happy New Year</h2>
                        <p class="mt-2 text-sm font-sans text-[#A60906] opacity-80 tracking-wider">WISHING YOU PROSPERITY &amp; JOY</p>
                        
                        <!-- 交互式祝福按钮 -->
                        <div class="mt-6 flex flex-wrap justify-center gap-3">
                            <button class="px-4 py-2 border border-[#D02F21] text-[#D02F21] text-sm font-semibold hover:bg-[#D02F21] hover:text-[#F7D5A5] transition-all duration-300 interactive-element">马到成功</button>
                            <button class="px-4 py-2 border border-[#D02F21] text-[#D02F21] text-sm font-semibold hover:bg-[#D02F21] hover:text-[#F7D5A5] transition-all duration-300 interactive-element">龙马精神</button>
                            <button class="px-4 py-2 border border-[#D02F21] text-[#D02F21] text-sm font-semibold hover:bg-[#D02F21] hover:text-[#F7D5A5] transition-all duration-300 interactive-element">万事如意</button>
                            <button class="px-4 py-2 border border-[#D02F21] text-[#D02F21] text-sm font-semibold hover:bg-[#D02F21] hover:text-[#F7D5A5] transition-all duration-300 interactive-element">恭喜发财</button>
                        </div>
                    </div>
                </div>

                <!-- 生成信息栏 -->
                <div class="w-full bg-[#D02F21] text-[#F7D5A5] text-center py-2 text-[10px] sm:text-xs font-sans tracking-widest uppercase border-t border-[#D02F21]">
                    由比特林制作 · 音乐与背景来源于网络
                </div>
            </main>
        </div>
        
        <!-- 页面脚注 -->
        <footer class="text-center text-sm opacity-70 mt-8 mb-4 interactive-element">
            <p>点击祝福按钮发送新年祝福 · 点击音乐按钮播放新年旋律</p>
            <p class="mt-2">背景烟花会随着音乐节奏变化 · 装饰元素可交互</p>
        </footer>
    </div>
    
    <!-- 音频元素 -->
    <audio id="audioElement" src="newyear.mp3" loop>
        您的浏览器不支持音频元素。
    </audio>
    
    <!-- JavaScript代码 -->
    <script>
        // 音频控制
        let isPlaying = false;
        let volume = 0.7;
        
        // 音乐可视化条
        const visualizer = document.getElementById('visualizer');
        const visualizerBars = [];
        
        // 初始化音乐可视化
        function initVisualizer() {
            visualizer.innerHTML = '';
            visualizerBars.length = 0;
            
            for (let i = 0; i < 32; i++) {
                const bar = document.createElement('div');
                bar.className = 'visualizer-bar flex-1';
                bar.style.height = '4px';
                bar.style.backgroundColor = i % 3 === 0 ? '#D02F21' : 
                                           i % 3 === 1 ? '#F7D5A5' : '#A60906';
                visualizer.appendChild(bar);
                visualizerBars.push(bar);
            }
        }
        
        // 更新音乐可视化
        function updateVisualizer() {
            if (!isPlaying) return;
            
            // 创建模拟的音频可视化效果
            visualizerBars.forEach((bar, index) => {
                // 使用正弦波和随机性模拟音频节奏
                const time = Date.now() * 0.001;
                const frequency = 0.5 + index * 0.1;
                const amplitude = Math.sin(time * frequency) * 0.5 + 0.5;
                const randomFactor = Math.random() * 0.3;
                const totalFactor = amplitude + randomFactor;
                
                // 根据模拟的振幅更新高度
                const baseHeight = 4;
                const newHeight = baseHeight + totalFactor * 40;
                
                bar.style.height = `${newHeight}px`;
                bar.style.opacity = 0.5 + totalFactor * 0.5;
            });
            
            requestAnimationFrame(updateVisualizer);
        }
        
        // 播放新年音乐
        function playNewYearMusic() {
            console.log('尝试播放音乐...');
            
            const audioElement = document.getElementById('audioElement');
            if (!audioElement) {
                console.error('音频元素未找到');
                return;
            }
            
            console.log('音频元素找到:', audioElement);
            console.log('音频文件路径:', audioElement.src);
            
            try {
                // 设置音量
                updateVolume();
                
                // 开始播放
                console.log('尝试播放音频...');
                audioElement.play().then(() => {
                    console.log('音频播放成功');
                }).catch(error => {
                    console.error('播放失败:', error);
                });
                
                // 开始可视化
                updateVisualizer();
            } catch (error) {
                console.error('播放音乐时出错:', error);
            }
        }
        
        // 停止音乐
        function stopMusic() {
            const audioElement = document.getElementById('audioElement');
            audioElement.pause();
            audioElement.currentTime = 0;
            
            // 停止可视化
            visualizerBars.forEach(bar => {
                bar.style.height = '4px';
                bar.style.opacity = 0.5;
            });
        }
        
        // 切换音乐播放状态
        function toggleMusic() {
            const toggleBtn = document.getElementById('musicToggle');
            const icon = toggleBtn.querySelector('i');
            const audioElement = document.getElementById('audioElement');
            
            if (!isPlaying) {
                // 开始播放
                playNewYearMusic();
                isPlaying = true;
                icon.className = 'fas fa-pause text-xl';
                toggleBtn.style.backgroundColor = '#A60906';
                
                // 增强背景效果
                increaseFireworks();
            } else {
                // 停止播放
                stopMusic();
                isPlaying = false;
                icon.className = 'fas fa-play text-xl';
                toggleBtn.style.backgroundColor = '#D02F21';
                
                // 减少背景效果
                decreaseFireworks();
            }
        }
        
        // 音量控制
        function updateVolume() {
            volume = document.getElementById('volumeControl').value / 100;
            const audioElement = document.getElementById('audioElement');
            audioElement.volume = volume;
        }
        
        // 背景装饰生成
        function createBackgroundDecorations() {
            const bgContainer = document.getElementById('bgDecoration');
            
            // 创建传统图案
            const patterns = ['福', '囍', '春', '馬', '吉'];
            for (let i = 0; i < 15; i++) {
                const pattern = document.createElement('div');
                pattern.className = 'chinese-pattern';
                
                // 随机位置和大小
                const size = Math.random() * 100 + 50;
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                
                pattern.style.width = `${size}px`;
                pattern.style.height = `${size}px`;
                pattern.style.left = `${left}%`;
                pattern.style.top = `${top}%`;
                
                // 随机图案（使用Unicode字符模拟）
                pattern.innerHTML = `<div style="font-size: ${size}px; font-family: 'Ma Shan Zheng', cursive; color: #D02F21; text-align: center;">${patterns[Math.floor(Math.random() * patterns.length)]}</div>`;
                
                // 随机动画延迟
                pattern.style.animationDelay = `${Math.random() * 2}s`;
                pattern.classList.add('twinkle-animation');
                
                bgContainer.appendChild(pattern);
            }
            
            // 创建初始烟花
            for (let i = 0; i < 30; i++) {
                createFirework();
            }
        }
        
        // 创建单个烟花
        function createFirework() {
            const bgContainer = document.getElementById('bgDecoration');
            const firework = document.createElement('div');
            firework.className = 'firework';
            
            // 随机位置
            const left = Math.random() * 100;
            const top = Math.random() * 100;
            
            // 随机颜色（红金配色）
            const colors = ['#D02F21', '#F7D5A5', '#A60906', '#FFD700'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            firework.style.left = `${left}%`;
            firework.style.top = `${top}%`;
            firework.style.backgroundColor = color;
            firework.style.boxShadow = `0 0 10px ${color}`;
            
            bgContainer.appendChild(firework);
            
            // 烟花动画
            animateFirework(firework);
        }
        
        // 烟花动画
        function animateFirework(firework) {
            // 随机大小
            const size = Math.random() * 6 + 2;
            firework.style.width = `${size}px`;
            firework.style.height = `${size}px`;
            
            // 淡入
            firework.style.opacity = '0';
            firework.style.transform = 'scale(0)';
            
            // 动画序列
            setTimeout(() => {
                firework.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                firework.style.opacity = '0.8';
                firework.style.transform = 'scale(1)';
                
                // 淡出
                setTimeout(() => {
                    firework.style.opacity = '0';
                    firework.style.transform = 'scale(0)';
                    
                    // 重新开始动画
                    setTimeout(() => {
                        // 随机移动位置
                        const left = Math.random() * 100;
                        const top = Math.random() * 100;
                        firework.style.left = `${left}%`;
                        firework.style.top = `${top}%`;
                        
                        // 重新开始动画
                        animateFirework(firework);
                    }, 1000);
                }, 1500);
            }, Math.random() * 3000);
        }
        
        // 增加烟花数量（音乐播放时）
        function increaseFireworks() {
            const bgContainer = document.getElementById('bgDecoration');
            const currentFireworks = bgContainer.querySelectorAll('.firework').length;
            
            // 如果烟花太少，添加更多
            if (currentFireworks < 80) {
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => createFirework(), i * 100);
                }
            }
        }
        
        // 减少烟花数量（音乐停止时）
        function decreaseFireworks() {
            const bgContainer = document.getElementById('bgDecoration');
            const fireworks = bgContainer.querySelectorAll('.firework');
            
            // 移除一半烟花
            const removeCount = Math.floor(fireworks.length / 2);
            for (let i = 0; i < removeCount && i < fireworks.length; i++) {
                setTimeout(() => {
                    if (fireworks[i]) {
                        fireworks[i].style.transition = 'opacity 1s ease';
                        fireworks[i].style.opacity = '0';
                        
                        setTimeout(() => {
                            if (fireworks[i] && fireworks[i].parentNode) {
                                fireworks[i].parentNode.removeChild(fireworks[i]);
                            }
                        }, 1000);
                    }
                }, i * 100);
            }
        }
        
        // 祝福按钮交互
        function setupBlessingButtons() {
            const buttons = document.querySelectorAll('button:not(#musicToggle)');
            
            buttons.forEach(button => {
                button.addEventListener('click', function() {
                    // 视觉反馈
                    this.style.transform = 'scale(0.95)';
                    this.style.backgroundColor = '#A60906';
                    
                    // 创建点击效果
                    const effect = document.createElement('div');
                    effect.style.position = 'absolute';
                    effect.style.width = '100%';
                    effect.style.height = '100%';
                    effect.style.top = '0';
                    effect.style.left = '0';
                    effect.style.borderRadius = 'inherit';
                    effect.style.backgroundColor = 'rgba(247, 213, 165, 0.3)';
                    effect.style.zIndex = '1';
                    effect.style.pointerEvents = 'none';
                    effect.style.animation = 'none';
                    
                    this.appendChild(effect);
                    
                    // 触发烟花效果
                    if (isPlaying) {
                        for (let i = 0; i < 5; i++) {
                            setTimeout(() => createFirework(), i * 100);
                        }
                    }
                    
                    // 移除效果
                    setTimeout(() => {
                        if (effect.parentNode) {
                            effect.parentNode.removeChild(effect);
                        }
                        this.style.transform = '';
                    }, 300);
                    
                    // 显示祝福语
                    const blessing = this.textContent;
                    showBlessingMessage(blessing);
                });
                
                // 悬停效果
                button.addEventListener('mouseenter', function() {
                    if (!isPlaying) return;
                    
                    // 轻微震动效果
                    this.style.transform = 'translateY(-2px)';
                });
                
                button.addEventListener('mouseleave', function() {
                    this.style.transform = '';
                });
            });
        }
        
        // 显示祝福消息
        function showBlessingMessage(message) {
            // 移除现有消息
            const existingMessage = document.querySelector('.blessing-message');
            if (existingMessage) {
                existingMessage.remove();
            }
            
            // 创建新消息
            const messageEl = document.createElement('div');
            messageEl.className = 'blessing-message fixed top-4 left-1/2 transform -translate-x-1/2 z-50 interactive-element';
            messageEl.innerHTML = `
                <div class="bg-black/80 border border-[#D02F21] rounded-lg p-4 shadow-lg" style="color: #F7D5A5;">
                    <div class="flex items-center gap-3">
                        <i class="fas fa-gift text-[#D02F21]"></i>
                        <div>
                            <p class="font-bold">${message}！</p>
                            <p class="text-sm opacity-80 mt-1">新年快乐，万事如意！</p>
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(messageEl);
            
            // 自动消失
            setTimeout(() => {
                if (messageEl.parentNode) {
                    messageEl.style.opacity = '0';
                    messageEl.style.transition = 'opacity 0.5s ease';
                    
                    setTimeout(() => {
                        if (messageEl.parentNode) {
                            messageEl.parentNode.removeChild(messageEl);
                        }
                    }, 500);
                }
            }, 3000);
        }
        
        // 初始化页面
        function initPage() {
            // 初始化音乐可视化
            initVisualizer();
            
            // 创建背景装饰
            createBackgroundDecorations();
            
            // 设置祝福按钮
            setupBlessingButtons();
            
            // 设置音乐控制
            const musicToggle = document.getElementById('musicToggle');
            musicToggle.addEventListener('click', toggleMusic);
            document.getElementById('volumeControl').addEventListener('input', updateVolume);
            
            // 添加用户交互事件监听器，以满足浏览器的自动播放策略
            document.addEventListener('click', function enableAudio() {
                // 移除监听器，避免重复调用
                document.removeEventListener('click', enableAudio);
                
                // 尝试创建音频上下文（如果需要）
                if (typeof AudioContext !== 'undefined' || typeof webkitAudioContext !== 'undefined') {
                    try {
                        const tempContext = new (AudioContext || webkitAudioContext)();
                        tempContext.close();
                        console.log('音频上下文已启用');
                    } catch (error) {
                        console.error('无法启用音频上下文:', error);
                    }
                }
            }, { once: true });
            
            // 添加滚动交互
            window.addEventListener('scroll', () => {
                const card = document.querySelector('.card-container');
                const scrollY = window.scrollY;
                
                // 轻微视差效果
                if (card) {
                    card.style.transform = `translateY(${scrollY * 0.05}px)`;
                }
            });
            
            // 添加鼠标移动交互
            document.addEventListener('mousemove', (e) => {
                if (!isPlaying) return;
                
                // 创建跟随鼠标的粒子
                if (Math.random() > 0.7) {
                    const particle = document.createElement('div');
                    particle.className = 'firework';
                    particle.style.left = `${e.clientX}px`;
                    particle.style.top = `${e.clientY}px`;
                    particle.style.width = '2px';
                    particle.style.height = '2px';
                    particle.style.backgroundColor = '#F7D5A5';
                    particle.style.boxShadow = '0 0 5px #F7D5A5';
                    particle.style.opacity = '0';
                    
                    document.getElementById('bgDecoration').appendChild(particle);
                    
                    // 粒子动画
                    particle.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
                    particle.style.opacity = '0.6';
                    particle.style.transform = 'scale(2)';
                    
                    setTimeout(() => {
                        particle.style.opacity = '0';
                        particle.style.transform = 'scale(0)';
                        
                        setTimeout(() => {
                            if (particle.parentNode) {
                                particle.parentNode.removeChild(particle);
                            }
                        }, 500);
                    }, 500);
                }
            });
            
            // 页面加载完成提示
            setTimeout(() => {
                showBlessingMessage('欢迎来到2026马年贺卡');
            }, 1000);
        }
        
        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', initPage);
        
        // 页面卸载前停止音乐
        window.addEventListener('beforeunload', () => {
            if (isPlaying) {
                stopMusic();
            }
        });
    </script>
</body>
</html>
